<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">C</span>
          <span>Campus<span class="brand-accent">Track</span></span>
        </a>
        <div class="account-bar">
          <div class="today" id="today"></div>
          <span class="user-name">{{ username }}</span>
          <a class="logout-link" href="{{ url_for('logout') }}">Log out</a>
        </div>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">Your academic command center</p>
          <h1>Stay on top of<br /><em>campus life.</em></h1>
          <p class="hero-copy">
            Keep classes, projects, and everything in between moving forward.
          </p>
        </div>
        <div class="hero-shape" aria-hidden="true">
          <span class="shape-dot dot-one"></span>
          <span class="shape-dot dot-two"></span>
          <span class="shape-ring"></span>
        </div>
      </section>

      <section class="stats" aria-label="Task summary">
        <article class="stat-card">
          <span class="stat-label">Total tasks</span>
          <strong id="total-count">0</strong>
          <span class="stat-note">on your plate</span>
        </article>
        <article class="stat-card">
          <span class="stat-label">Due soon</span>
          <strong id="due-count">0</strong>
          <span class="stat-note">in the next 7 days</span>
        </article>
        <article class="stat-card accent-card">
          <span class="stat-label">Completed</span>
          <strong id="completed-count">0</strong>
          <span class="stat-note">nice work</span>
        </article>
      </section>

      <section class="workspace">
        <div class="tasks-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Keep moving</p>
              <h2>Your tasks</h2>
            </div>
            <div class="filters" role="group" aria-label="Filter tasks">
              <button class="filter active" data-filter="all">All</button>
              <button class="filter" data-filter="open">Open</button>
              <button class="filter" data-filter="done">Done</button>
            </div>
          </div>
          <div id="task-list" class="task-list" aria-live="polite"></div>
        </div>

        <aside class="form-panel">
          <div class="form-heading">
            <span class="plus-icon">+</span>
            <div>
              <p class="eyebrow" id="form-eyebrow">Make a plan</p>
              <h2 id="form-title">Add a task</h2>
            </div>
          </div>
          <form id="task-form">
            <label>
              Task title
              <input name="title" type="text" placeholder="e.g. Finish research paper" required />
            </label>
            <label>
              Category
              <select name="category" required>
                <option value="" disabled selected>Choose a category</option>
                <option>Assignment</option>
                <option>Coursework</option>
                <option>Exam</option>
                <option>Campus Event</option>
                <option>Project</option>
                <option>Personal</option>
                <option>Organization</option>
              </select>
            </label>
            <div class="form-row">
              <label>
                Due date
                <input name="due_date" type="date" required />
              </label>
              <label>
                Priority
                <select name="priority">
                  <option>Low</option>
                  <option selected>Medium</option>
                  <option>High</option>
                </select>
              </label>
            </div>
            <label>
              Repeat
              <select name="recurrence">
                <option value="None" selected>Does not repeat</option>
                <option value="Daily">Every day</option>
                <option value="Weekly">Every week</option>
                <option value="Monthly">Every month</option>
              </select>
            </label>
            <p id="form-message" class="form-message" role="alert"></p>
            <button class="submit-button" type="submit">
              <span id="submit-label">Add to my list</span> <span>→</span>
            </button>
            <button class="cancel-button" id="cancel-edit" type="button" hidden>
              Cancel editing
            </button>
          </form>
        </aside>
      </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
